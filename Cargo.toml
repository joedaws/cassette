[package]
name = "cassette"
version = "0.10.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2.0"
ulid = "3"
fs4 = "1"
serde_json = "1"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"
